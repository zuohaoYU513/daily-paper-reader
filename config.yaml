          query_cn: 在金融情感分析中，有哪些技术可以检测和缓解大语言模型的幻觉？
          enabled: true
          source: manual
          note: ''
        - query: How can external knowledge improve the factuality of NLP models applied to financial documents?
          query_cn: 外部知识如何提高应用于金融文档的NLP模型的事实性？
          enabled: true
