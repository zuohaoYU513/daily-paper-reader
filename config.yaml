          query: model hallucination in large language models
        - keyword: retrieval augmented generation
          keyword_cn: 检索增强生成
          query: retrieval augmented generation for knowledge grounding
        - keyword: hallucination detection
          keyword_cn: 幻觉检测
          query: methods for detecting hallucination in generated text
        - keyword: financial text generation
          keyword_cn: 金融文本生成
          query: generating financial reports and summaries with language models
        - keyword: financial sentiment analysis
          keyword_cn: 金融情感分析
          query: analyzing sentiment in financial news and social media with NLP
        - keyword: factuality of language models
          keyword_cn: 语言模型事实性
          query: improving factual accuracy of language model outputs
      intent_queries:
        - query: How does retrieval augmented generation reduce model hallucination when generating financial text?
          query_cn: 检索增强生成如何减少金融文本生成中的模型幻觉？
          enabled: true
          source: manual
          note: ''
        - query: >-
            What techniques detect and mitigate hallucinations in large language models for financial sentiment
